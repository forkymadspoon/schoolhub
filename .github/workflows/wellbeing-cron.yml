name: Wellbeing Evaluation Cron

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # manual trigger for testing

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger wellbeing evaluation
        run: |
          curl --fail-with-body -sS -X POST "${{ secrets.API_URL }}/api/internal/wellbeing/evaluate" \
            -H "x-internal-key: ${{ secrets.INTERNAL_API_KEY }}" \
            -H "Content-Type: application/json"
